name: Publicar frontend
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [dev, prod]
        default: dev
        required: true
permissions:
  contents: read
concurrency:
  group: frontend-deploy-${{ inputs.stage }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}
      - name: Validar destino e publicar
        env:
          SITE_BUCKET: ${{ vars.AWS_S3_BUCKET || secrets.AWS_S3_BUCKET }}
          DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID || secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          DEPLOY_STAGE: ${{ inputs.stage }}
        run: python3 scripts/publish.py
      - name: Preservar build e identificação da release
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ inputs.stage }}-${{ github.sha }}
          path: |
            dist/
            release.json
          retention-days: 90
